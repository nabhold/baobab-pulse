name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    # Pin is nabhold/shared's v1.2.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/nabhold/shared.git v1.2.0`.
    uses: nabhold/shared/.github/workflows/foundation-repository-gates.yml@38defb11aacd95a6f68b7db8026fe336417a2af6 # v1.2.0
    with:
      dockerfile: "Dockerfile"
      build_context: "."
