name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    # Pin is nabhold/shared's main branch merge commit for PR #14 (fixes the
    # minimum_version floor comparison that was failing this job for this
    # repository's genuine baobab-dev 1.3.0 declaration — see
    # docs/operations/environment-contract-note.md), verified live via
    # `git ls-remote https://github.com/nabhold/shared.git main`. No tag
    # covers this commit yet (still v1.2.0 as of this pin) — repin to a
    # tagged release once nabhold/shared cuts one that includes it.
    uses: nabhold/shared/.github/workflows/foundation-repository-gates.yml@2da1a429602d2f1421c498d412bb6c65a5626127 # main, post-#14 (unreleased)
    with:
      dockerfile: "Dockerfile"
      build_context: "."
